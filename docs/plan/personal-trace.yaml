  - id: PERS-PR-004
    classification: mixed
    statement: The Personal daemon is the sole authority writer.
    direct_registry_requirements: [REQ-AUTH-001, REQ-STATE-001, REQ-STATE-003, REQ-EVT-001]
    product_only_aspects: [daemon-process-identity, single-writer-deployment-topology]
