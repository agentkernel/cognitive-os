version: "0.3"
status: planning
classification: product-plan-trace-only

# This is a Personal product-plan trace. It is intentionally separate from the
# registry-derived matrix: PERS-PR IDs are planning IDs, not REQ IDs.
sources:
  project_identity: docs/governance/project-scope.yaml
  formal_plan: docs/plan/PERSONAL-DEVELOPMENT-PLAN.md
  delivery_slice_definitions: docs/plan/PERSONAL-DEVELOPMENT-PLAN.md
  current_progress: docs/plan/PROGRESS.md
  research_plan: plan.md
  registry: specs/registry/requirements.yaml
  registry_matrix: docs/traceability/matrix.yaml

rules:
  direct_registry_requirements: exact registered REQ IDs only
  product_only: no direct registry requirement is claimed
  evidence_status: legacy requirement-level field; represents formal gate evidence only and does not erase task or implementation progress
  task_status: pure research and uncommitted planning do not change status; first implementation or test slice changes not-started to in-progress
  delivery_slice: stable task-internal P*-T*/DNN increment; formal plan owns definitions and exits, while PROGRESS.md Current snapshot alone owns current status
  delivery_closure: requires a vertical or durable outcome plus actually passed focused and supported validation; implementation with required validation not-run remains blocked
  work_in_progress: at most one in-progress delivery slice per formal task; an enabling slice must be followed by real caller or durable-outcome integration rather than another helper-only slice
  claim_boundary: local, fixture, WSL, and ordinary CI evidence cannot promote product Gate, release, or Profile status unless included in the Gate's predeclared campaign
  current_status: owned only by docs/plan/PROGRESS.md Current snapshot; this file must not copy it

status_dimensions:
  task_status: [not-started, in-progress, blocked, done, cancelled]
  delivery_slice_status: [ready, in-progress, blocked, done, cancelled]
  development_track: [production-path, experimental-local-only]
  implementation_evidence: [none, provided, tested-local, tested-supported-ci]
  gate_status: [not-run, running, pass, fail, blocked]
  claim_scope: [non-claim, product-gate, release, profile]

gate_catalog:
  G0: { phase: P0, benchmarks: [] }
  G1: { phase: P1, benchmarks: [B01] }
  G2: { phase: P2, benchmarks: [B02, B04, B05, B12] }
  G3: { phase: P3, benchmarks: [B03, B06, B07] }
  G4: { phase: P4, benchmarks: [B08] }
  G5: { phase: P5, benchmarks: [B09, B10] }
  G6: { phase: P6, benchmarks: [B11] }
  G7: { phase: P7, benchmarks: [RC] }
  B01-W:
    phase: P7
    classification: product-only
    tasks: [P7-T07]
  B01:
    phase: P1
    classification: product-only
    campaign_policy: docs/adr/0039-personal-b01-six-attempt-campaign-policy.md
  GMVP-LINUX:
    phase: P7
    classification: product-only
    product_version: "1.0.0"
    benchmarks: [B01, B02, B03, B04, B05, B08, B09, B12]

