version: "0.1"
status: planning
classification: documentation-only

# This is a Personal product-plan trace. It is intentionally separate from the
# registry-derived matrix: PERS-PR IDs are planning IDs, not REQ IDs.
sources:
  formal_plan: docs/plan/PERSONAL-DEVELOPMENT-PLAN.md
  research_plan: plan.md
  registry: specs/registry/requirements.yaml
  registry_matrix: docs/traceability/matrix.yaml

rules:
  direct_registry_requirements: exact registered REQ IDs only
  product_only: no direct registry requirement is claimed
  evidence_status: not-run does not inherit conformance or Profile status

gate_catalog:
  G0: { phase: P0, benchmarks: [] }
  G1: { phase: P1, benchmarks: [B01] }
  G2: { phase: P2, benchmarks: [B02, B04, B05, B12] }
  G3: { phase: P3, benchmarks: [B03, B06, B07] }
  G4: { phase: P4, benchmarks: [B08] }
  G5: { phase: P5, benchmarks: [B09, B10] }
  G6: { phase: P6, benchmarks: [B11] }
  G7: { phase: P7, benchmarks: [RC] }
  GMVP-LINUX:
    phase: P7
    classification: product-only
    benchmarks: [B01, B02, B04, B05, B12]

# P0-T01 is an enabling baseline rather than a product requirement delivery.
enabling_tasks: [P0-T01]

personal_requirements:
  - id: PERS-PR-001
    classification: product-only
    statement: Linux users can verify installation and roll back.
    direct_registry_requirements: []
    tasks: [P0-T03, P1-T08, P1-T09, P7-T01, P7-T02, P7-T08, P7-T06]
    gates: [G1, B01, GMVP-LINUX, G7, RC]
    evidence_status: not-run

  - id: PERS-PR-002
    classification: product-only
    statement: cognitive init initializes directories, Secret Store, Provider, daemon, and Pi.
    direct_registry_requirements: []
    tasks: [P0-T05, P0-T06, P0-T07, P1-T01, P1-T02, P1-T03, P1-T04, P1-T05, P1-T06, P1-T07, P1-T08, P1-T09, P7-T08]
