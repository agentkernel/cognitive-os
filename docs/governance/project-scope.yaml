version: "1.0"
repository_workspace: "d:/agent-kernel"
repository_role: architecture-reference-plus-single-active-project
architecture_layer:
  id: cognitiveos-architecture
  status: reference-and-contract-foundation
  sources:
    - CognitiveOS-Architecture.md
    - RFC-0001-cognitiveos-governance-context-access.md
    - specs/
    - conformance/
active_project:
  id: cognitiveos-personal
  name: CognitiveOS Personal
  status: active
  formal_plan: docs/plan/PERSONAL-DEVELOPMENT-PLAN.md
  current_snapshot: docs/plan/PROGRESS.md
  lease_ledger: docs/plan/PARALLEL-LANES.md
  product_design: docs/product/personal/README.md
  architecture_design: docs/architecture/personal/README.md
canonical_sources:
  project_identity: docs/governance/PROJECT-IDENTITY.md
  development_workflow: docs/governance/DEVELOPMENT-OPERATING-MODEL.md
  change_sync: docs/standards/docs-sync-contract.md
  task_catalog: docs/plan/PERSONAL-DEVELOPMENT-PLAN.md
  current_snapshot: docs/plan/PROGRESS.md
  active_leases: docs/plan/PARALLEL-LANES.md
workflow_policy_owner:
  path: docs/governance/DEVELOPMENT-OPERATING-MODEL.md
  policy_ids:
    - TASK-ATOMIC-DELIVERY-01
    - CHECKPOINT-DELIVERY-01
    - CONTINUOUS-AUTONOMOUS-DELIVERY-01
    - RESOLVE-BEFORE-BLOCKED-PROGRESS-01
work_policy:
