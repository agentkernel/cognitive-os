version: "1.1"
repository_workspace: "d:/agent-kernel"
repository_role: architecture-reference-plus-single-active-project
# ADR-0054 subproject directory layout (one repository, one active project):
subproject_roots:
  core: cognitiveos-core (contracts/authority substrate; 1.0.0 finalized, core/docs/VERSION-1.0.0.md)
  personal: cognitiveos-personal (sole active product; 1.0.0 finalized, personal/docs/VERSION-1.0.0.md)
  enterprise: cognitiveos-enterprise (design-only; enterprise/docs/VERSION-1.0.0.md defines boundary and activation gate)
  clients: imported cognitiveos-clients subproject (own governance; UI implementation path clients/pc/web)
architecture_layer:
  id: cognitiveos-architecture
  status: reference-and-contract-foundation
  sources:
    - core/docs/architecture/CognitiveOS-Architecture.md
    - core/docs/architecture/RFC-0001-cognitiveos-governance-context-access.md
    - core/specs/
    - core/conformance/
active_project:
  id: cognitiveos-personal
  name: CognitiveOS Personal
  status: active
  formal_plan: docs/plan/PERSONAL-DEVELOPMENT-PLAN.md
  current_snapshot: docs/plan/PROGRESS.md
  lease_ledger: docs/plan/PARALLEL-LANES.md
  product_design: personal/docs/product/README.md
  architecture_design: personal/docs/architecture/README.md
canonical_sources:
  project_identity: docs/governance/PROJECT-IDENTITY.md
  axioms: docs/governance/AXIOMS.md
  development_workflow: docs/governance/DEVELOPMENT-OPERATING-MODEL.md
  change_sync: docs/standards/docs-sync-contract.md
  task_catalog: docs/plan/PERSONAL-DEVELOPMENT-PLAN.md
  current_snapshot: docs/plan/PROGRESS.md
  active_leases: docs/plan/PARALLEL-LANES.md
axiom_policy_owner:
  path: docs/governance/AXIOMS.md
  axiom_ids:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    - A8
  principle_ids:
    - P1
    - P2
    - P3
workflow_policy_owner:
  path: docs/governance/DEVELOPMENT-OPERATING-MODEL.md
  policy_ids:
    - TASK-ATOMIC-DELIVERY-01
    - CHECKPOINT-DELIVERY-01
    - CONTINUOUS-AUTONOMOUS-DELIVERY-01
    - CAMPAIGN-BACKLOG-CONTINUATION-01
    - RESOLVE-BEFORE-BLOCKED-PROGRESS-01
work_policy:
  default_scope: active-project-only
  architecture_changes: personal-driven-and-lane-ctr-controlled
  non_active_projects: design-or-deferred-only
excluded_from_active_project:
  - personal-blog/
  - History/
  - clients/ (in-repo client subproject with its own governance; not a P*-T* work surface by default)
  - enterprise/ (design layer; implementation not authorized)
claim_policy:
  local_fixture_wsl_and_ordinary_ci: non-claim-unless-gate-campaign-declares-them
  profile_implemented: requires-independent-applicable-must-evidence
