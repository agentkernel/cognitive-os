[package]
name = "cognitive-runtime"
description = "Operation executor, sandbox/adapter ports and the Harness Loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
test-fault-injection = []
native-campaign-faults = []

[[bin]]
name = "linux_bundle_campaign_builder"
path = "src/bin/linux_bundle_campaign_builder.rs"

[[bin]]
name = "linux_bundle_campaign_pre_pointer_fault_daemon"
path = "src/bin/linux_bundle_campaign_pre_pointer_fault_daemon.rs"
required-features = ["native-campaign-faults"]

[[bin]]
name = "linux_bundle_campaign_post_pointer_fault_daemon"
path = "src/bin/linux_bundle_campaign_post_pointer_fault_daemon.rs"
required-features = ["native-campaign-faults"]

[dependencies]
cognitive-contracts = { workspace = true }
cognitive-domain = { workspace = true }
cognitive-kernel = { workspace = true }
cognitive-store = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
serde_json_canonicalizer.workspace = true
url = { workspace = true }
# Safe extraction does not preserve archive ownership or extended attributes.
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
nix = { version = "0.31.3", features = ["signal", "process"] }

[dev-dependencies]
cognitive-management = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
