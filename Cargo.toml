# CognitiveOS — Rust virtual workspace across the subproject roots (ADR-0054).
# Dependency direction is fixed: contracts -> domain -> ports (traits) -> adapters/apps,
# and core/ crates never depend on personal/ crates.
# See docs/adr/0001-rust-typescript.md and docs/adr/0054-*.md.

[workspace]
resolver = "2"
members = [
    "core/crates/cognitive-contracts",
    "core/crates/cognitive-domain",
    "core/crates/cognitive-kernel",
    "core/crates/cognitive-akp",
    "personal/crates/cognitive-store",
    "personal/crates/cognitive-runtime",
    "personal/crates/cognitive-management",
    "personal/crates/cognitive-conformance",
    "personal/crates/cognitive-secret",
    "personal/crates/cognitive-provider-transport",
    "personal/apps/kernel-server",
    "personal/apps/admin-cli",
    "personal/apps/pi-agent-adapter",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"
# License decided P0-T03 / ADR-0025. publish remains false until a later P7 owner decision.

[workspace.dependencies]
cognitive-contracts = { path = "core/crates/cognitive-contracts" }
cognitive-domain = { path = "core/crates/cognitive-domain" }
cognitive-store = { path = "personal/crates/cognitive-store" }
cognitive-kernel = { path = "core/crates/cognitive-kernel" }
cognitive-runtime = { path = "personal/crates/cognitive-runtime" }
cognitive-management = { path = "personal/crates/cognitive-management" }
cognitive-akp = { path = "core/crates/cognitive-akp" }
cognitive-conformance = { path = "personal/crates/cognitive-conformance" }
cognitive-secret = { path = "personal/crates/cognitive-secret" }
cognitive-provider-transport = { path = "personal/crates/cognitive-provider-transport" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
thiserror = "2.0"
base64 = "0.23.0"
ed25519-dalek = { version = "3.0.0", features = ["signature"] }
url = "2.5.8"
# M2 store adapter (ADR-0002: SQLite WAL). `bundled` compiles the pinned
# SQLite C source so CI needs no system SQLite on either OS.
rusqlite = { version = "0.40.1", features = ["bundled"] }
# RFC 9562 UUIDv7 generation (ADR-0005), adapter layer only.
uuid = { version = "1.24", features = ["v7"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
